version: 2

# Dependency drift had nobody watching it. On 2026-08-05 a manual `npm audit`
# found 42 advisories — 1 critical, 19 high — and `npm outdated` showed the
# framework four minors behind. Neither number was discoverable without running
# the command by hand. This file is the alarm that was missing.
#
# TWO THINGS TO KNOW BEFORE MERGING WHAT IT OPENS:
#
#  1. npm rewrites the design-tokens git spec to `git+ssh` in the lockfile on
#     every install, Dependabot's included. It does NOT break `npm ci`: this
#     workflow and netlify.toml both set git's `insteadOf` rewrite, which sends
#     it over https before npm forks git (measured, and asserted by a blocking
#     unit test). It is spelling, not breakage, and no longer fails a PR the
#     robot cannot fix. Check and repair on the branch with:
#       npm run lockfile:https -- --check     # reports, writes nothing
#       npm run lockfile:https                # rewrites
#
#  2. The framework group breaks the build by MORE THAN ONE ROUTE, so do not
#     read a fix for one as a fix for the group. Two seen so far, both from
#     bumps INSIDE the same major:
#
#       - @tailwindcss/vite dies with "Missing field `tsconfigPaths` on
#         BindingViteResolvePluginConfig" when astro 6.4.8 pulls vite 8 through
#         @astrojs/netlify. Hit locally on 2026-08-05, bumping astro alone.
#       - the newer Astro compiler rejects markup the old one accepted:
#         "[CompilerError] Closing tag '</a>' has no matching opening tag."
#         This is what CI actually reproduced on the group's first PR (#132),
#         with all five packages moving together — a different failure from the
#         one written here first, which is why this note now lists both.
#
#     Neither is caught by unit tests. Run `npm run build` on any
#     astro/vite/tailwind bump before believing a green tick.

updates:
  # MONTHLY, deliberately. Weekly opened six pull requests within minutes of
  # being switched on, and this repo has no standing owner for the queue: a
  # thread wires the robot, closes, and the PRs keep arriving. Twelve unattended
  # PRs in a month is how a robot gets switched off, taking the only alarm for
  # ageing dependencies with it. Monthly plus the open-PR cap keeps the backlog
  # to one sitting for whoever picks it up next.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # Pinned to a git tag on purpose; `npm run tokens:version` reports how far
      # behind this repo is, and moving it is a design-system decision.
      - dependency-name: '@aglaya/design-tokens'
    groups:
      # One PR for the routine noise.
      patch-and-minor:
        patterns: ['*']
        update-types: [minor, patch]
        exclude-patterns:
          - astro
          - '@astrojs/*'
          - vite
          - tailwindcss
          - '@tailwindcss/*'
      # The build-breaking cluster, kept separate so it is reviewed on its own
      # and never rides in on a batch of harmless patches. See note 2 above.
      framework:
        patterns:
          - astro
          - '@astrojs/*'
          - vite
          - tailwindcss
          - '@tailwindcss/*'
    labels:
      - dependencies

  # Ungrouped, this opened one PR per action within a minute of being switched
  # on. CI is its own proof here — an action bump that breaks the runner turns
  # every job red — so a single batched PR is both cheaper to review and no less
  # safe than four.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    labels:
      - dependencies
      - ci
