version: 2

# Dependency drift had nobody watching it. On 2026-08-05 a manual `npm audit`
# found 42 advisories — 1 critical, 19 high — and `npm outdated` showed the
# framework four minors behind. Neither number was discoverable without running
# the command by hand. This file is the alarm that was missing.
#
# TWO THINGS TO KNOW BEFORE MERGING WHAT IT OPENS:
#
#  1. npm rewrites the design-tokens git spec to `git+ssh` in the lockfile on
#     every install, Dependabot's included. It does NOT break `npm ci`: this
#     workflow and netlify.toml both set git's `insteadOf` rewrite, which sends
#     it over https before npm forks git (measured, and asserted by a blocking
#     unit test). It is spelling, not breakage, and no longer fails a PR the
#     robot cannot fix. Check and repair on the branch with:
#       npm run lockfile:https -- --check     # reports, writes nothing
#       npm run lockfile:https                # rewrites
#
#  2. Green CI is not enough for the framework group. Astro 6.4.8 pulls vite 8
#     through @astrojs/netlify, and @tailwindcss/vite then dies at build with
#     "Missing field `tsconfigPaths` on BindingViteResolvePluginConfig" — a
#     break INSIDE the same major. Run `npm run build` on any astro/vite/tailwind
#     bump before believing it.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: increase
    ignore:
      # Pinned to a git tag on purpose; `npm run tokens:version` reports how far
      # behind this repo is, and moving it is a design-system decision.
      - dependency-name: '@aglaya/design-tokens'
    groups:
      # One PR for the routine noise.
      patch-and-minor:
        patterns: ['*']
        update-types: [minor, patch]
        exclude-patterns:
          - astro
          - '@astrojs/*'
          - vite
          - tailwindcss
          - '@tailwindcss/*'
      # The build-breaking cluster, kept separate so it is reviewed on its own
      # and never rides in on a batch of harmless patches. See note 2 above.
      framework:
        patterns:
          - astro
          - '@astrojs/*'
          - vite
          - tailwindcss
          - '@tailwindcss/*'
    labels:
      - dependencies

  # Ungrouped, this opened one PR per action within a minute of being switched
  # on. CI is its own proof here — an action bump that breaks the runner turns
  # every job red — so a single batched PR is both cheaper to review and no less
  # safe than four.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    labels:
      - dependencies
      - ci
