name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# @aglaya/design-tokens is a git dependency on a public GitHub tag, and npm
# resolves GitHub specs over ssh regardless of what package.json and the lockfile
# say. Runners have no ssh key, so `npm ci` fails with "Permission denied
# (publickey)". git's own env-var config (git >= 2.31) rewrites the URL to https
# before npm forks git. Mirrored in netlify.toml — both installers need it.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: 'url.https://github.com/.insteadOf'
  GIT_CONFIG_VALUE_0: 'ssh://git@github.com/'

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      # Coverage was installed and wired to nothing: `@vitest/coverage-v8` in
      # devDependencies, a `coverage` block in vitest.config.ts, and no caller.
      # Reported, not gated — no thresholds are configured, so the number is
      # information, not a verdict. Set thresholds before making it blocking.
      - name: Coverage report (src/i18n + netlify/functions)
        run: npm run test:unit:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # Two checkers that were also installed and wired to nothing. Both are RED
  # against today's content — `astro check` reports 143 errors, `markdownlint`
  # 857 — so they run NON-BLOCKING on purpose: the job exists to put the number
  # on every PR instead of leaving it discoverable only by running it by hand.
  # Gating the merge on either is a separate decision, to be taken once its
  # backlog is burned down. Do not flip `continue-on-error` before then: a red
  # required check that nobody can turn green is how a whole CI gets ignored.
  quality:
    name: Typecheck + Markdown lint (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (astro check)
        id: typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Markdown lint
        id: lintmd
        continue-on-error: true
        run: npm run lint:md

      # npm writes ssh GitHub specs into the lockfile on every install, including
      # Dependabot's. `npm ci` survives it — ci.yml and netlify.toml both rewrite
      # ssh to https before npm forks git, and that net is asserted by a blocking
      # unit test — so this is spelling, not breakage, and must not fail a PR the
      # robot cannot fix. Fix on the branch with `npm run lockfile:https`.
      - name: Lockfile resolves over https
        id: lockfile
        continue-on-error: true
        run: npm run lockfile:https -- --check

      - name: Report both outcomes
        if: always()
        run: |
          {
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| \`astro check\` | ${{ steps.typecheck.outcome }} |"
            echo "| \`markdownlint\` | ${{ steps.lintmd.outcome }} |"
            echo "| lockfile https | ${{ steps.lockfile.outcome }} |"
            echo ""
            echo "Both are non-blocking. See the job log for the counts."
          } >> "$GITHUB_STEP_SUMMARY"

  tokens:
    # The only check that can tell consuming the design system from copying it:
    # move a colour at the source, rebuild without touching this repo, and see
    # whether the pixel followed. Everything else here a good copy would pass.
    name: Design-system mutation proof
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prove the brand is consumed, not copied
        run: npm run tokens:mutation-proof

  e2e:
    name: E2E + Accessibility Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build site
        run: npm run build

      - name: Install serve
        run: npm install -g serve

      - name: Run E2E + A11y tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
