[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # @aglaya/design-tokens is a git dependency on a public GitHub tag. npm insists
  # on resolving GitHub specs over ssh — even when package.json and the lockfile
  # both say https — and every build runner here is keyless, so `npm ci` dies with
  # "Permission denied (publickey)". These three are git's own env-var config
  # (GIT_CONFIG_COUNT, git >= 2.31): they rewrite ssh to https for github.com
  # before npm ever forks git, which the build command could not do — install
  # runs first. The same three are set in .github/workflows/ci.yml.
  GIT_CONFIG_COUNT = "1"
  GIT_CONFIG_KEY_0 = "url.https://github.com/.insteadOf"
  GIT_CONFIG_VALUE_0 = "ssh://git@github.com/"
  # SENTRY_ORG/SENTRY_PROJECT are slugs (e.g. "aglaya-biz"), not secrets, but
  # the slug collides with brand strings in source (e.g. a CRM source label),
  # which trips secrets scanning. Omit these non-secret keys from the scan.
  SECRETS_SCAN_OMIT_KEYS = "PUBLIC_SENTRY_DSN,SENTRY_ORG,SENTRY_PROJECT"

# Portuguese is no longer published (2026-09-24): the site is EN + ES. ONE rule
# sends every old /pt/ address to its Spanish twin; no per-page rules. Listed
# first so no later rule can claim a /pt/ path. `force = true` because the
# Astro Netlify adapter serves unmatched paths through its SSR function, and a
# non-forced rule is only a fallback — the function could answer (with a 404)
# before the redirect is consulted. With src/pages/pt/ gone there is no static
# file for it to shadow, so forcing costs nothing. A translated slug keeps its
# Portuguese spelling (/pt/privacidade/ -> /es/privacidade/); that miss was
# accepted as a 404, and the /es/privacidade/ rule below happens to rescue it.
# Guarded by tests/unit/no-portuguese.test.ts.
[[redirects]]
  from = "/pt/*"
  to   = "/es/:splat"
  status = 301
  force = true

# Redirect localized legal-page paths that the language switcher may generate
# (switcher strips the /es prefix naively; these paths don't follow the standard pattern)
[[redirects]]
  from = "/privacidad/"
  to   = "/es/privacidad/"
  status = 301

[[redirects]]
  from = "/privacidade/"
  to   = "/es/privacidad/"
  status = 301

[[redirects]]
  from = "/es/privacy/"
  to   = "/es/privacidad/"
  status = 301

[[redirects]]
  from = "/es/privacidade/"
  to   = "/es/privacidad/"
  status = 301

[[redirects]]
  from = "/en/privacidad/"
  to   = "/privacy/"
  status = 301

[[redirects]]
  from = "/en/privacidade/"
  to   = "/privacy/"
  status = 301

# 404 pages: localized variants don't exist as real routes
[[redirects]]
  from = "/es/404/"
  to   = "/404/"
  status = 301

# Legal notice redirects
[[redirects]]
  from = "/aviso-legal/"
  to   = "/legal-notice/"
  status = 301

[[redirects]]
  from = "/es/legal-notice/"
  to   = "/es/aviso-legal/"
  status = 301
